name: Release

# Tag-driven so a release is one deliberate act, not a side effect of a push to
# main. `git tag v0.1.3 && git push --tags` publishes everywhere.
on:
  push:
    tags: ["v*"]

# Least privilege, and note that `permissions:` REPLACES the defaults rather
# than adding to them — every scope this job needs has to be listed here or it
# is silently absent (bitten before: `actions: read` dropped `packages: read`).
#   id-token: write  -> npm trusted publishing + mcp-publisher github-oidc
#   contents: write  -> attach the MCPB bundle to the GitHub Release
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 22 ships
      # npm 10.x, so the bundled CLI would fall back to asking for a token and
      # fail with an auth error that reads like a misconfigured secret.
      - name: npm >= 11.5.1 for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The tag is the only thing a human types. If it disagrees with the
      # manifests, publishing would put out a version nobody asked for — and npm
      # versions cannot be recalled. Cheapest possible check, first.
      - name: tag matches the manifests
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $TAG, package.json says $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - name: format
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
      # Hits the live published spec. A release that emits query keys the API
      # drops is worse than no release: the answers stay plausible.
      - name: API contract (live spec)
        run: npm run test:contract

      - name: publish to npm
        run: npm publish --access public

      # The registry validates the npm tarball, so it MUST come after the npm
      # publish — reversed, it 4xxs on a version that does not exist yet.
      # github-oidc replaces the interactive login whose token expired within a
      # day and broke the 0.1.2 release.
      - name: publish to the MCP registry
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: build the MCPB bundle
        run: npm run bundle

      - name: attach the bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "build/entyrix-mcp-${GITHUB_REF_NAME#v}.mcpb" \
            || gh release upload "$GITHUB_REF_NAME" \
                 "build/entyrix-mcp-${GITHUB_REF_NAME#v}.mcpb" --clobber

      # Last on purpose: npm and the registry are the surfaces that matter, and
      # they are already done by this point. A failure here goes red and names
      # itself rather than being swallowed — a skipped publish that reports
      # success is how a directory listing silently rots.
      - name: publish the bundle to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "::error::SMITHERY_API_KEY is not set — the bundle was built but not published"
            exit 1
          fi
          npx -y @smithery/cli@latest mcp publish \
            "build/entyrix-mcp-${GITHUB_REF_NAME#v}.mcpb" \
            -n entyrix/entyrix-mcp

  alert:
    needs: [release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -H "Title: entyrix-mcp release failed" -H "Tags: rotating_light" \
            -d "${{ github.ref_name }} failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/inger-deploy-alerts || true
