name: Publish to Smithery

# Separate from release.yml, and deliberately so.
#
# The 0.1.3 release published to npm and to the MCP registry and then failed
# here with ten copies of "expected object, received undefined" — one per tool.
# The cause is not yet known: the obvious candidate (tools[].inputSchema in the
# MCPB manifest) is rejected by MCPB's own schema, so any fix is a guess that
# needs a real publish to test.
#
# Iterating on that inside the release would burn an npm version per attempt,
# and npm versions cannot be recalled. This workflow republishes the bundle for
# an already-released tag as many times as it takes, touching nothing else.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to publish (e.g. v0.1.3)
        required: true
      config_schema:
        description: "Optional path to a config schema, e.g. smithery-config.json"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smithery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build the MCPB bundle
        run: npm run bundle

      - name: publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "::error::SMITHERY_API_KEY is not set"
            exit 1
          fi
          TAG="${{ inputs.tag }}"
          BUNDLE="build/entyrix-mcp-${TAG#v}.mcpb"
          EXTRA=""
          if [ -n "${{ inputs.config_schema }}" ]; then
            EXTRA="--config-schema ${{ inputs.config_schema }}"
          fi
          npx -y @smithery/cli@latest mcp publish "$BUNDLE" -n entyrix/entyrix-mcp $EXTRA
